name: Release

on:
  push:
    tags: ["v*"]
  # Lets a build be checked without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: Linux AppImage
    # Pinned, not latest: the AppImage's glibc floor is whatever it is built
    # against, and moving to a newer runner would silently drop older distros.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: sudo --preserve-env=DEBIAN_FRONTEND ./scripts/build-appimage.sh

      - name: Check that it starts
        run: |
          set -euo pipefail
          image="$(echo dist/TuxFlow-*-x86_64.AppImage)"
          sudo chown "$USER" "$image"
          chmod +x "$image"
          # No FUSE on the runner, and no display either — this only proves the
          # bundled interpreter, GTK bindings, and TuxFlow itself all import.
          APPIMAGE_EXTRACT_AND_RUN=1 "$image" --version

          # doctor exits 1 when a required check legitimately fails, which is
          # the normal outcome here: no microphone, no session. Anything else,
          # or a traceback on the way, is a real bug and has to fail the build.
          set +e
          output="$(APPIMAGE_EXTRACT_AND_RUN=1 "$image" doctor 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error::tuxflow doctor exited $status (expected 0 or 1)"
            exit 1
          fi
          if echo "$output" | grep -q "Traceback"; then
            echo "::error::tuxflow doctor crashed with a traceback"
            exit 1
          fi

      - name: Checksums
        run: |
          set -euo pipefail
          # The build ran under sudo, so dist/ belongs to root.
          sudo chown "$USER" dist
          cd dist
          # Relative names, so `sha256sum -c SHA256SUMS` works next to the file.
          sha256sum -- *.AppImage >SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/SHA256SUMS

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag push is the only trigger for a release, and nothing else
          # creates one, so make it here if it is missing. It is left as a
          # draft on purpose: the maintainer reviews the notes and publishes.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          # The .zsync file goes up with the rest: the AppImage advertises it as
          # its update source, and AppImageUpdate looks for it by name among the
          # latest release's assets.
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.AppImage dist/*.AppImage.zsync dist/SHA256SUMS --clobber
